[project]
name = "agentic-rag-clone"
version = "0.1.0"
description = "Study Buddy: learn from your documents with grounded answers, lessons and quizzes"
requires-python = ">=3.11,<3.15"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "langgraph>=1,<2",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.7,<3",
  "pypdf>=6,<7",
]

[dependency-groups]
dev = [
    "playwright>=1.49,<2",
    "pytest>=8,<10",
    "pytest-asyncio>=1,<2",
    "pytest-playwright>=0.6,<1",
    "pytest-rerunfailures>=15,<17",
    "pytest-timeout>=2.3,<3",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = ["tests/browser"]

[tool.ruff]
line-length = 100
extend-exclude = [".local"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
