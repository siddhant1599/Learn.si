<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ask mode research graph</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #fdfaf3;
      --color-ink:     #0a0a0a;
      --color-muted:   #666666;
      --color-accent:  #cd4000;
      --font-sans:     'Geist', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; }
    .diagram-container { width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 960px; display: block; }
    @media print {
      .diagram-container { overflow-x: visible; }
      svg { min-width: 0; }
    }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Flowchart · Learn.si</p>
    <h1>Ask mode research graph</h1>

        <rect width="100%" height="100%" fill="#fdfaf3"/>
        <path d="M 400,80 V 112" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 472,148 H 560" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,184 V 224" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 328,148 H 248 Q 240,148 240,156 V 328 Q 240,336 248,336 H 336" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>

        <path d="M 400,360 V 416" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 328,452 H 280" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 216,428 V 396 Q 216,388 224,388 H 396" fill="none" stroke="#666666" stroke-width="1.2"/>
        <path d="M 472,452 H 576" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>
        <path d="M 400,488 V 528" fill="none" stroke="#cd4000" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <path d="M 640,476 V 544 Q 640,552 632,552 H 472" fill="none" stroke="#666666" stroke-width="1.2" marker-end="url(#arrow)"/>

        <rect x="144" y="238" width="88" height="12" rx="2" fill="#fdfaf3"/>
        <text x="188" y="247" fill="#717171" font-size="8" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle" letter-spacing="0.06em">DIRECT LOOKUP</text>
        <rect x="286" y="434" width="36" height="12" rx="2" fill="#fdfaf3"/>

        <rect x="478" y="434" width="92" height="12" rx="2" fill="#fdfaf3"/>

        <rect x="408" y="502" width="68" height="12" rx="2" fill="#fdfaf3"/>

        <rect x="516" y="534" width="80" height="12" rx="2" fill="#fdfaf3"/>

        <text x="400" y="452" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Assess</text>

        <rect x="152" y="428" width="128" height="48" rx="6" fill="#fdfaf3"/>
        <rect x="152" y="428" width="128" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="216" y="449.5" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Refine</text>

        <rect x="576" y="428" width="128" height="48" rx="6" fill="#fdfaf3"/>

        <text x="640" y="449.5" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Web research</text>
        <text x="640" y="464.5" fill="#666666" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">Tavily · ≤ 2 calls</text>
        <rect x="328" y="528" width="144" height="48" rx="6" fill="#fdfaf3"/>
        <rect x="328" y="528" width="144" height="48" rx="6" fill="#ffffff" stroke="#0a0a0a" stroke-width="1"/>
        <text x="400" y="549.5" fill="#0a0a0a" font-size="12" font-weight="600" font-family="'Geist', system-ui, sans-serif" text-anchor="middle">Synthesize</text>
        <text x="400" y="564.5" fill="#666666" font-size="9" font-family="'Geist Mono', ui-monospace, monospace" text-anchor="middle">stream · cite [n]</text>
        <rect x="324" y="612" width="152" height="40" rx="20" fill="#fdfaf3"/>
        <rect x="324" y="612" width="152" height="40" rx="20" fill="rgba(102,102,102,0.1)" stroke="#717171" stroke-width="1"/>

        <text x="736" y="318" fill="#0a0a0a" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">error_handler for a bounded</text>
        <text x="736" y="336" fill="#0a0a0a" font-size="14" font-style="italic" font-family="'Instrument Serif', 'Noto Serif', serif" text-anchor="start">retry; synthesis never replays</text>

        <text x="530" y="715" fill="#666666" font-size="8.5" font-family="'Geist', system-ui, sans-serif">Grounded answer path</text>

    </div>
  </div>
</body>
</html>
