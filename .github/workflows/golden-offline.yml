name: Golden dataset offline checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  golden-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
      - run: uv sync --locked
      - run: >-
          uv run ruff check evals app/agents/evidence.py app/agents/synthesis.py
          tests/test_golden*.py tests/test_citation_formats.py tests/test_synthesis.py
      - run: >-
          uv run pytest tests/test_golden*.py tests/test_citation_formats.py
          tests/test_synthesis.py -q
